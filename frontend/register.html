<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Career Tracker</title>
    <style>
        /* --- RESET & BASE --- */
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #F1F5F9; /* Light Gray Background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* --- CARD DESIGN --- */
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* --- TYPOGRAPHY --- */
        h2 { color: #1E293B; /* Slate Gray */ margin-bottom: 10px; }
        p { color: #64748B; font-size: 14px; margin-bottom: 30px; }

        /* --- FORMS --- */
        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: bold; color: #475569; margin-bottom: 5px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            box-sizing: border-box; /* Fixes padding issues */
            font-size: 14px;
        }
        input:focus { border-color: #2563EB; outline: none; }

        /* --- BUTTONS --- */
        .btn-primary {
            background-color: #2563EB; /* Royal Blue */
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary:hover { background-color: #1D4ED8; }

        .link { color: #2563EB; text-decoration: none; font-size: 14px; }
        .footer { margin-top: 20px; font-size: 13px; color: #64748B; }
        
        /* Message Box for Errors/Success */
        #message { margin-bottom: 15px; font-size: 14px; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Create Account</h2>
        <p>Start tracking your career journey today.</p>

        <div id="message"></div>

        <form id="registerForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required placeholder="e.g. Anwen">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary">Sign Up</button>
        </form>

        <div class="footer">
            Already have an account? <a href="login.html" class="link">Login here</a>
        </div>
    </div>

    <script src="js/register.js"></script>
</body>
</html>
