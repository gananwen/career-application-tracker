<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Manager - Career Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Resume Cards */
        .resume-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .resume-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 20px; position: relative; transition: transform 0.2s; }
        .resume-card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        .file-icon { font-size: 40px; color: #EF4444; margin-bottom: 15px; } /* PDF Red */
        .resume-name { font-weight: 700; color: var(--dark); font-size: 15px; display: block; margin-bottom: 5px; }
        .resume-tag { background: #F3F4F6; color: #6B7280; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        
        .card-footer { margin-top: 15px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 15px; }
        .view-link { font-size: 13px; color: var(--primary); text-decoration: none; font-weight: 600; }
        .delete-btn { color: #EF4444; background: none; border: none; cursor: pointer; font-size: 13px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">Career<span>Up</span></div>
        <div class="menu">
            <a href="dashboard.html"><i class="fa-solid fa-table-columns"></i> Dashboard</a>
            <a href="calendar.html"><i class="fa-solid fa-calendar"></i> Calendar</a>
            <a href="kanban.html"><i class="fa-solid fa-list-check"></i> Kanban Board</a>
            <a href="add-application.html"><i class="fa-solid fa-plus"></i> Add Application</a>
            
            <a href="networking.html"><i class="fa-solid fa-address-book"></i> Networking</a> 
            <a href="#" class="active"><i class="fa-solid fa-file-pdf"></i> Resumes</a> <!-- NEW -->

            <div class="menu-label">Career Toolkit</div>
            <a href="offer-comparator.html"><i class="fa-solid fa-scale-balanced"></i> Offer Comparator</a> 
            <a href="email-generator.html"><i class="fa-solid fa-envelope-open-text"></i> Email Architect</a>
            <a href="keyword-scanner.html"><i class="fa-solid fa-file-contract"></i> ATS Scanner</a>
            <a href="interview-prep.html"><i class="fa-solid fa-microphone-lines"></i> Interview Prep</a>
        </div>
        <div class="user-profile">
            <a href="settings.html" style="color: inherit; text-decoration: none; display: flex; align-items: center; justify-content: space-between;">
                <span><i class="fa-solid fa-gear"></i> Settings</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 10px;"></i>
            </a>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div>
                <h1>Resume Version Control</h1>
                <p>Manage specific resume versions for different roles.</p>
            </div>
            <button onclick="openModal()" class="btn-add"><i class="fa-solid fa-cloud-arrow-up"></i> Upload Resume</button>
        </div>

        <div id="resumeGrid" class="resume-grid">
            <!-- JS Populates this -->
        </div>
    </div>

    <!-- UPLOAD MODAL -->
    <div id="uploadModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
        <div class="form-container" style="margin:0;">
            <h2 style="margin-top:0;">Upload Resume</h2>
            <form id="uploadForm">
                <div class="form-group">
                    <label>Version Name</label>
                    <input type="text" id="rName" required placeholder="e.g. Frontend Specialist V2">
                </div>
                <div class="form-group">
                    <label>Tag (Category)</label>
                    <select id="rTag">
                        <option value="General">General</option>
                        <option value="Frontend">Frontend</option>
                        <option value="Backend">Backend</option>
                        <option value="Fullstack">Fullstack</option>
                        <option value="Data">Data Science</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>PDF File</label>
                    <input type="file" id="rFile" accept=".pdf" required style="border:none; padding:0;">
                </div>
                <button type="submit" class="btn-submit" style="width:100%">Upload</button>
                <button type="button" onclick="closeModal()" class="btn-cancel" style="width:100%">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        async function loadResumes() {
            try {
                const res = await fetch('http://localhost:5000/api/resumes', {
                    headers: { 'x-auth-token': token }
                });
                const resumes = await res.json();
                
                const grid = document.getElementById('resumeGrid');
                grid.innerHTML = '';

                if (resumes.length === 0) {
                    grid.innerHTML = '<p style="color:#6B7280;">No resumes uploaded yet.</p>';
                    return;
                }

                resumes.forEach(resume => {
                    const card = `
                        <div class="resume-card">
                            <i class="fa-solid fa-file-pdf file-icon"></i>
                            <span class="resume-name">${resume.name}</span>
                            <span class="resume-tag">${resume.tag}</span>
                            <div class="card-footer">
                                <a href="http://localhost:5000/uploads/${resume.file_path}" target="_blank" class="view-link">View File</a>
                                <button onclick="deleteResume(${resume.id})" class="delete-btn"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                    grid.innerHTML += card;
                });
            } catch (err) { console.error(err); }
        }

        // Handle Upload
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('name', document.getElementById('rName').value);
            formData.append('tag', document.getElementById('rTag').value);
            formData.append('resume', document.getElementById('rFile').files[0]);

            try {
                const res = await fetch('http://localhost:5000/api/resumes', {
                    method: 'POST',
                    headers: { 'x-auth-token': token },
                    body: formData // No Content-Type header! Browser sets it automatically with boundary for FormData
                });
                if(res.ok) {
                    closeModal();
                    loadResumes();
                } else { alert("Upload failed"); }
            } catch (err) { console.error(err); }
        });

        async function deleteResume(id) {
            if(!confirm("Delete this resume?")) return;
            await fetch(`http://localhost:5000/api/resumes/${id}`, { method: 'DELETE', headers: { 'x-auth-token': token } });
            loadResumes();
        }

        function openModal() { document.getElementById('uploadModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('uploadModal').style.display = 'none'; }

        loadResumes();
    </script>
</body>
</html>
